# Checks a clean clone without secrets or model calls: data validation, the fast test suite
# (slow tests, which call a real model or download one, are deselected by pyproject.toml), and an oracle dry run.
name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag after v7, so the release is pinned exactly.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run python -m tools.validate
      - run: uv run pytest -q
      - run: uv run python -m harness.run --adapter oracle --dry-run
